<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CPM Pro Cheat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      border-radius: 18px;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(56, 189, 248, 0.25);
      width: 290px;
    }
    .header { text-align: center; margin-bottom: 12px; }
    .header h3 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 12px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .guide-card {
      font-size: 11.5px;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.45;
      text-align: center;
      white-space: pre-line;
    }
    .input-box {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      outline: none;
      display: none;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
    .btn-glow { background: linear-gradient(135deg, #a855f7, #7c3aed); }
    .btn-red { 
      background: rgba(239, 68, 68, 0.15); 
      color: #f87171; 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      padding: 8px; 
      font-size: 11px; 
    }
    .status-bar {
      font-size: 10.5px;
      color: #64748b;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>CPM PRO CHEAT</h3>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnBody" onclick="switchTab('body')">Mod Body Xe</button>
    <button class="tab-btn" id="tabBtnGlow" onclick="switchTab('glow')">Mod Phát Sáng</button>
  </div>

  <!-- TAB 1: MOD BODY -->
  <div id="tabBody" class="tab-content active">
    <div class="guide-card" id="guideBody">Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.</div>
    <input type="number" id="inputBody" class="input-box" placeholder="Nhập ID Body muốn mod...">
    <button class="btn btn-green" id="btnBody" onclick="nextBodyStep()">Bước 1: Quét Cản 2 (Search 1)</button>
    <button class="btn btn-red" onclick="resetBodySteps()">Làm lại từ đầu</button>
  </div>

  <!-- TAB 2: MOD PHÁT SÁNG (CHUẨN 7 BƯỚC) -->
  <div id="tabGlow" class="tab-content">
    <div class="guide-card" id="guideGlow">Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.</div>
    <input type="number" id="inputGlow" class="input-box" value="38" placeholder="Độ sáng (mặc định 38)">
    <button class="btn btn-green" id="btnGlow" onclick="nextGlowStep()">Bước 1: Quét Màu Trắng (F32 = 1)</button>
    <button class="btn btn-red" onclick="resetGlowSteps()">Làm lại từ đầu</button>
  </div>

  <div class="status-bar" id="statusLog">Sẵn sàng hoạt động</div>

  <script>
    const ANON_MIN = '0x100000000';
    const ANON_MAX = '0x200000000';

    function setStatus(msg) {
      document.getElementById('statusLog').innerText = msg;
    }

    function hideKeyboard() {
      if (document.activeElement) document.activeElement.blur();
    }

    function switchTab(tab) {
      hideKeyboard();
      document.getElementById('tabBody').classList.remove('active');
      document.getElementById('tabGlow').classList.remove('active');
      document.getElementById('tabBtnBody').classList.remove('active');
      document.getElementById('tabBtnGlow').classList.remove('active');

      if (tab === 'body') {
        document.getElementById('tabBody').classList.add('active');
        document.getElementById('tabBtnBody').classList.add('active');
      } else {
        document.getElementById('tabGlow').classList.add('active');
        document.getElementById('tabBtnGlow').classList.add('active');
      }
      setStatus("Đã chuyển tab");
    }

    // ==========================================
    // 1. LOGIC MOD BODY
    // ==========================================
    let stepBody = 1;
    function nextBodyStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      hideKeyboard();
      const btn = document.getElementById('btnBody');
      const input = document.getElementById('inputBody');
      const guide = document.getElementById('guideBody');

      if (stepBody === 1) {
        setStatus("Đang quét cản 2...");
        h5gg.clearResults();
        h5gg.searchNumber('1', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Không tìm thấy!"); return; }
        stepBody = 2;
        guide.innerText = `Tìm thấy ${count} kết quả.\n👉 Chọn CẢN SỐ 3 rồi bấm nút dưới.`;
        btn.innerText = "Bước 2: Lọc Cản 3 (Refine 2)";
        setStatus(`Còn ${count} kết quả`);
      } else if (stepBody === 2) {
        h5gg.searchNumber('2', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 3;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chọn CẢN SỐ 4 rồi bấm nút dưới.`;
        btn.innerText = "Bước 3: Lọc Cản 4 (Refine 3)";
      } else if (stepBody === 3) {
        h5gg.searchNumber('3', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 4;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chọn CẢN SỐ 5 rồi bấm nút dưới.`;
        btn.innerText = "Bước 4: Lọc Cản 5 (Refine 4)";
      } else if (stepBody === 4) {
        h5gg.searchNumber('4', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 5;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chọn CẢN SỐ 6 rồi bấm nút dưới.`;
        btn.innerText = "Bước 5: Lọc Cản 6 (Refine 5)";
      } else if (stepBody === 5) {
        h5gg.searchNumber('5', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 6;
        guide.innerText = `✅ ĐÃ TÌM ĐƯỢC ${count} ĐỊA CHỈ!\n👉 Ra gara chọn xe có hốc gió rồi bấm nút dưới.`;
        btn.innerText = "Đã Chọn Xe (Tiếp tục)";
        btn.className = "btn btn-orange";
      } else if (stepBody === 6) {
        stepBody = 7;
        guide.innerText = "👉 Nhập ID Body muốn mod rồi bấm Áp Dụng.";
        input.style.display = "block";
        btn.innerText = "Áp Dụng Body Mod";
        btn.className = "btn btn-green";
      } else if (stepBody === 7) {
        let val = input.value.trim();
        if (!val || isNaN(val)) { alert("Vui lòng nhập số ID!"); return; }
        h5gg.editAll(val, 'I32');
        alert(`ĐÃ MOD THÀNH CÔNG SANG BODY ID: ${val}`);
        resetBodySteps();
      }
    }

    function resetBodySteps() {
      hideKeyboard();
      stepBody = 1;
      document.getElementById('inputBody').style.display = "none";
      document.getElementById('inputBody').value = "";
      document.getElementById('btnBody').className = "btn btn-green";
      document.getElementById('btnBody').innerText = "Bước 1: Quét Cản 2 (Search 1)";
      document.getElementById('guideBody').innerText = "Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.";
      setStatus("Sẵn sàng hoạt động");
    }

    // ==========================================
    // 2. LOGIC MOD PHÁT SÁNG (ĐỦ 7 BƯỚC LỌC SẠCH)
    // ==========================================
    let stepGlow = 1;
    const sequenceGlow = [
      { val: '1', name: 'TRẮNG (#FFFFFF)' },
      { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' },
      { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' },
      { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' }
    ];

    function nextGlowStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      hideKeyboard();
      const btn = document.getElementById('btnGlow');
      const input = document.getElementById('inputGlow');
      const guide = document.getElementById('guideGlow');

      if (currentGlowStepHandler()) return;

      function currentGlowStepHandler() {
        if (stepGlow === 1) {
          setStatus("Đang quét an toàn...");
          setTimeout(() => {
            h5gg.clearResults();
            h5gg.searchNumber('1', 'F32', ANON_MIN, ANON_MAX);
            let count = h5gg.getResultsCount();
            if (count === 0) { alert("Không tìm thấy giá trị 1! Hãy kéo màu về TRẮNG (#FFFFFF)."); return; }
            
            stepGlow = 2;
            guide.innerText = `Còn ${count} kết quả.\n👉 Bây giờ hãy kéo màu về ĐEN (#000000), rồi bấm nút dưới.`;
            btn.innerText = "Bước 2: Lọc Màu Đen (F32 = 0)";
            setStatus(`Còn ${count} kết quả`);
          }, 80);
          return true;
        } 
        else if (stepGlow >= 2 && stepGlow <= 7) {
          let currentTarget = sequenceGlow[stepGlow - 1].val;
          setStatus(`Đang lọc Float ${currentTarget}...`);
          
          setTimeout(() => {
            h5gg.searchNumber(currentTarget, 'F32', ANON_MIN, ANON_MAX);
            let count = h5gg.getResultsCount();
            if (count === 0) { alert("Lọc thất bại! Hãy làm lại từ đầu."); resetGlowSteps(); return; }

            if (stepGlow === 7) {
              stepGlow = 8;
              guide.innerText = `✅ ĐÃ LỌC XONG (Còn ${count} địa chỉ sạch)!\n\nNhập độ sáng phát sáng (mặc định: 38) rồi bấm Kích Hoạt.`;
              input.style.display = "block";
              btn.innerText = "Kích Hoạt Phát Sáng";
              btn.className = "btn btn-glow";
              setStatus(`Khóa ${count} địa chỉ`);
            } else {
              stepGlow++;
              const nextTarget = sequenceGlow[stepGlow - 1];
              guide.innerText = `Còn ${count} kết quả.\n👉 Kéo màu về ${nextTarget.name}, rồi bấm nút dưới.`;
              btn.innerText = `Bước ${stepGlow}: Lọc Màu ${nextTarget.val === '1' ? 'Trắng' : 'Đen'} (F32 = ${nextTarget.val})`;
              setStatus(`Còn ${count} kết quả`);
            }
          }, 80);
          return true;
        } 
        else if (stepGlow === 8) {
          let val = input.value.trim();
          if (!val || isNaN(val)) { alert("Vui lòng nhập độ sáng hợp lệ!"); return; }

          setStatus("Đang ghi đè giá trị...");
          setTimeout(() => {
            h5gg.editAll(val, 'F32');
            alert(`THÀNH CÔNG!\nĐã chỉnh độ sáng thành ${val}.\n👉 Chạm nhẹ vào chi tiết hoặc chuyển tab để xe phát sáng!`);
            setStatus("Mod thành công!");
            resetGlowSteps();
          }, 50);
          return true;
        }
      }
    }

    function resetGlowSteps() {
      hideKeyboard();
      stepGlow = 1;
      document.getElementById('inputGlow').style.display = "none";
      document.getElementById('inputGlow').value = "38";
      const btn = document.getElementById('btnGlow');
      btn.className = "btn btn-green";
      btn.innerText = "Bước 1: Quét Màu Trắng (F32 = 1)";
      document.getElementById('guideGlow').innerText = "Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.";
      setStatus("Sẵn sàng hoạt động");
    }
  </script>
</body>
</html>
