<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CPM Mod Menu Glitch</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: rgba(18, 18, 24, 0.95);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      border-radius: 14px;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 290px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      text-align: center;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 2px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #1e293b;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #38bdf8;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .guide {
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      line-height: 1.4;
      text-align: center;
      white-space: pre-line;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); }
    .btn-orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .btn-glow { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .btn-red { background: linear-gradient(135deg, #dc2626, #b91c1c); margin-top: 6px; }
    .status {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      text-align: center;
      display: none;
    }
    #inputGlitch { display: block; }
  </style>
</head>
<body>

  <h3>CPM ALL-IN-ONE MENU</h3>

  <div class="tabs">
    <button class="tab-btn" id="tabBtnBody" onclick="switchTab('body')">Mod Body</button>
    <button class="tab-btn" id="tabBtnGlow" onclick="switchTab('glow')">Phát Sáng</button>
    <button class="tab-btn active" id="tabBtnGlitch" onclick="switchTab('glitch')">Glitch Car</button>
  </div>

  <!-- TAB 1: MOD BODY XE -->
  <div id="tabBody" class="tab-content">
    <div class="guide" id="guideBody">Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.</div>
    <input type="number" id="inputBody" placeholder="Nhập ID Body muốn mod...">
    <button class="btn btn-green" id="btnBody" onclick="nextBodyStep()">Bước 1: Quét Cản 2 (Search 1)</button>
    <button class="btn btn-red" onclick="resetBodySteps()">Làm lại từ đầu</button>
  </div>

  <!-- TAB 2: MOD PHÁT SÁNG -->
  <div id="tabGlow" class="tab-content">
    <div class="guide" id="guideGlow">Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.</div>
    <input type="number" id="inputGlow" value="8" placeholder="Độ sáng (mặc định 8)">
    <button class="btn btn-green" id="btnGlow" onclick="nextGlowStep()">Bước 1: Quét Màu Trắng (F32 = 1)</button>
    <button class="btn btn-red" onclick="resetGlowSteps()">Làm lại từ đầu</button>
  </div>

  <!-- TAB 3: GLITCH CAR (BUFF HP / TORQUE) -->
  <div id="tabGlitch" class="tab-content active">
    <div class="guide" id="guideGlitch">👉 Hãy mua động cơ V6 3.5 và TẤT CẢ mục OTHER. Sau đó thoát ra ngoài và nhập số HP hiện tại vào ô dưới.</div>
    <input type="number" id="inputGlitch" placeholder="Nhập HP hiện tại...">
    <button class="btn btn-green" id="btnGlitch" onclick="nextGlitchStep()">Bước 1: Tìm HP & Đổi 1515</button>
    <button class="btn btn-red" onclick="resetGlitchSteps()">Làm lại từ đầu</button>
  </div>

  <div class="status" id="statusLog">Sẵn sàng</div>

  <script>
    const ANON_MIN = '0x100000000';
    const ANON_MAX = '0x200000000';

    function setStatus(msg) {
      document.getElementById('statusLog').innerText = msg;
    }

    function switchTab(tab) {
      document.getElementById('tabBody').classList.remove('active');
      document.getElementById('tabGlow').classList.remove('active');
      document.getElementById('tabGlitch').classList.remove('active');
      
      document.getElementById('tabBtnBody').classList.remove('active');
      document.getElementById('tabBtnGlow').classList.remove('active');
      document.getElementById('tabBtnGlitch').classList.remove('active');

      if (tab === 'body') {
        document.getElementById('tabBody').classList.add('active');
        document.getElementById('tabBtnBody').classList.add('active');
      } else if (tab === 'glow') {
        document.getElementById('tabGlow').classList.add('active');
        document.getElementById('tabBtnGlow').classList.add('active');
      } else if (tab === 'glitch') {
        document.getElementById('tabGlitch').classList.add('active');
        document.getElementById('tabBtnGlitch').classList.add('active');
      }
      setStatus("Đã chuyển tab");
    }

    // ==========================================
    // 1. LOGIC MOD BODY XE (I32)
    // ==========================================
    let stepBody = 1;

    function nextBodyStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      const btn = document.getElementById('btnBody');
      const input = document.getElementById('inputBody');
      const guide = document.getElementById('guideBody');

      if (stepBody === 1) {
        setStatus("Đang quét giá trị 1...");
        h5gg.clearResults();
        h5gg.searchNumber('1', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Không tìm thấy!"); return; }
        stepBody = 2;
        guide.innerText = `Tìm thấy ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 3, rồi bấm nút dưới.`;
        btn.innerText = "Bước 2: Lọc Cản 3 (Refine 2)";
      } else if (stepBody === 2) {
        setStatus("Đang lọc giá trị 2...");
        h5gg.searchNumber('2', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 3;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 4, rồi bấm nút dưới.`;
        btn.innerText = "Bước 3: Lọc Cản 4 (Refine 3)";
      } else if (stepBody === 3) {
        setStatus("Đang lọc giá trị 3...");
        h5gg.searchNumber('3', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 4;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 5, rồi bấm nút dưới.`;
        btn.innerText = "Bước 4: Lọc Cản 5 (Refine 4)";
      } else if (stepBody === 4) {
        setStatus("Đang lọc giá trị 4...");
        h5gg.searchNumber('4', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 5;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 6, rồi bấm nút dưới.`;
        btn.innerText = "Bước 5: Lọc Cản 6 (Refine 5)";
      } else if (stepBody === 5) {
        setStatus("Đang lọc giá trị 5...");
        h5gg.searchNumber('5', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 6;
        guide.innerText = `✅ ĐÃ TÌM ĐƯỢC ${count} ĐỊA CHỈ!\n\n👉 Thoát ra ngoài, CHỌN XE CÓ HỐC GIÓ bạn muốn mod.\n👉 Chọn xong bấm nút xác nhận bên dưới.`;
        btn.innerText = "Đã Chọn Xe (Tiếp tục)";
        btn.className = "btn btn-orange";
      } else if (stepBody === 6) {
        stepBody = 7;
        guide.innerText = "👉 Nhập số ID Body muốn mod vào ô bên dưới, sau đó bấm Áp Dụng.";
        input.style.display = "block";
        btn.innerText = "Áp Dụng Body Mod";
        btn.className = "btn btn-green";
      } else if (stepBody === 7) {
        let val = input.value.trim();
        if (!val || isNaN(val)) { alert("Vui lòng nhập số ID hợp lệ!"); return; }
        h5gg.editAll(val, 'I32');
        alert(`ĐÃ THAY ĐỔI THÀNH CÔNG SANG BODY ID: ${val}`);
        resetBodySteps();
      }
    }

    function resetBodySteps() {
      stepBody = 1;
      document.getElementById('inputBody').style.display = "none";
      document.getElementById('inputBody').value = "";
      document.getElementById('btnBody').className = "btn btn-green";
      document.getElementById('btnBody').innerText = "Bước 1: Quét Cản 2 (Search 1)";
      document.getElementById('guideBody').innerText = "Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.";
      setStatus("Sẵn sàng");
    }

    // ==========================================
    // 2. LOGIC MOD PHÁT SÁNG (ANONYMOUS & F32)
    // ==========================================
    let stepGlow = 1;
    const sequenceGlow = [
      { val: '1', name: 'TRẮNG (#FFFFFF)' }, { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' }, { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' }, { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' }
    ];

    function nextGlowStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      const btn = document.getElementById('btnGlow');
      const input = document.getElementById('inputGlow');
      const guide = document.getElementById('guideGlow');

      if (stepGlow === 1) {
        setStatus("Đang quét Anonymous F32 = 1...");
        setTimeout(() => {
          h5gg.clearResults();
          h5gg.searchNumber('1', 'F32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();

          if (count === 0) { alert("Không tìm thấy giá trị 1! Hãy chắc chắn kéo màu về TRẮNG (#FFFFFF)."); return; }
          stepGlow = 2;
          guide.innerText = `Còn ${count} kết quả.\n👉 Bây giờ hãy kéo màu về ĐEN (#000000), rồi bấm nút dưới.`;
          btn.innerText = "Bước 2: Lọc Màu Đen (F32 = 0)";
        }, 100);
      } else if (stepGlow >= 2 && stepGlow <= 7) {
        let currentTarget = sequenceGlow[stepGlow - 1].val;
        setStatus(`Đang lọc Anonymous Float ${currentTarget}...`);
        setTimeout(() => {
          h5gg.searchNumber(currentTarget, 'F32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();
          if (count === 0) { alert(`Lọc thất bại!`); resetGlowSteps(); return; }
          if (stepGlow === 7) {
            stepGlow = 8;
            guide.innerText = `✅ ĐÃ LỌC XONG (Còn ${count} địa chỉ)!\n\nNhập độ sáng (mặc định: 8) rồi bấm Kích Hoạt.`;
            input.style.display = "block";
            btn.innerText = "Kích Hoạt Phát Sáng (Set = 8)";
            btn.className = "btn btn-glow";
          } else {
            stepGlow++;
            const nextTarget = sequenceGlow[stepGlow - 1];
            guide.innerText = `Còn ${count} kết quả.\n👉 Kéo màu về ${nextTarget.name}, rồi bấm nút dưới.`;
            btn.innerText = `Bước ${stepGlow}: Lọc Màu ${nextTarget.val === '1' ? 'Trắng' : 'Đen'} (F32 = ${nextTarget.val})`;
          }
        }, 100);
      } else if (stepGlow === 8) {
        let val = input.value.trim();
        if (!val || isNaN(val)) { alert("Vui lòng nhập số hợp lệ!"); return; }
        h5gg.editAll(val, 'F32');
        alert(`THÀNH CÔNG!\nĐã chỉnh độ sáng thành ${val}.`);
        resetGlowSteps();
      }
    }

    function resetGlowSteps() {
      stepGlow = 1;
      document.getElementById('inputGlow').style.display = "none";
      document.getElementById('inputGlow').value = "8";
      document.getElementById('btnGlow').className = "btn btn-green";
      document.getElementById('btnGlow').innerText = "Bước 1: Quét Màu Trắng (F32 = 1)";
      document.getElementById('guideGlow').innerText = "Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.";
      setStatus("Sẵn sàng");
    }

    // ==========================================
    // 3. LOGIC GLITCH CAR (ANONYMOUS & F32)
    // ==========================================
    let stepGlitch = 1;

    function nextGlitchStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được inject!"); return; }
      const btn = document.getElementById('btnGlitch');
      const input = document.getElementById('inputGlitch');
      const guide = document.getElementById('guideGlitch');
      let val = input.value.trim();

      // BƯỚC 1: Quét HP ban đầu & Lọc nếu > 20 kết quả
      if (stepGlitch === 1) {
        if (!val || isNaN(val)) { alert("Vui lòng nhập HP hiện tại!"); return; }
        setStatus(`Đang quét HP: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        let count = h5gg.getResultsCount();

        if (count === 0) {
          alert(`Không tìm thấy HP ${val}! Hãy kiểm tra lại số HP.`);
          setStatus("Không tìm thấy");
          return;
        }

        if (count > 20) {
          stepGlitch = 1.5;
          guide.innerText = `Tìm thấy ${count} kết quả (> 20)!\n👉 Hãy vào mục phụ tùng MUA THÊM hoặc THÁO BỚT bất kỳ đồ nào làm HP thay đổi.\n👉 Sau đó nhập số HP mới vào ô dưới rồi bấm Lọc Tiếp.`;
          input.value = "";
          input.placeholder = "Nhập số HP mới sau khi đổi đồ...";
          btn.innerText = "Lọc Tiếp HP (Refine)";
          btn.className = "btn btn-orange";
          setStatus(`Còn ${count} kết quả - Cần lọc tiếp`);
          return;
        }

        // Nếu <= 20 kết quả: Đổi luôn thành 1515
        h5gg.editAll('1515', 'F32');
        stepGlitch = 2;
        input.value = "";
        input.placeholder = "Nhập số RPM bên cạnh HP...";
        guide.innerText = `✅ Đã đổi HP thành 1515!\n\n👉 Bây giờ nhập số RPM nằm KẾ BÊN HP vào ô dưới.`;
        btn.innerText = "Bước 2: Tìm RPM & Đổi thành 2023";
        btn.className = "btn btn-green";
        setStatus("Đã đổi HP -> 1515");
      }
      // BƯỚC PHỤ: Lọc lại HP nếu lần đầu > 20 kết quả
      else if (stepGlitch === 1.5) {
        if (!val || isNaN(val)) { alert("Vui lòng nhập số HP mới!"); return; }
        setStatus(`Đang lọc lại HP: ${val}...`);
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        let count = h5gg.getResultsCount();

        if (count === 0) { alert("Lọc thất bại! Vui lòng làm lại từ đầu."); resetGlitchSteps(); return; }

        if (count > 20) {
          alert(`Vẫn còn ${count} kết quả. Hãy tiếp tục thay đổi phụ tùng để HP khác đi và nhập lại!`);
          input.value = "";
          return;
        }

        // Đã đạt dưới 20 kết quả -> Đổi thành 1515
        h5gg.editAll('1515', 'F32');
        stepGlitch = 2;
        input.value = "";
        input.placeholder = "Nhập số RPM bên cạnh HP...";
        guide.innerText = `✅ Đã lọc an toàn (${count} kết quả) & đổi HP thành 1515!\n\n👉 Bây giờ nhập số RPM nằm KẾ BÊN HP vào ô dưới.`;
        btn.innerText = "Bước 2: Tìm RPM & Đổi thành 2023";
        btn.className = "btn btn-green";
        setStatus("Đã đổi HP -> 1515");
      }
      // BƯỚC 2: Quét RPM HP -> Đổi thành 2023
      else if (stepGlitch === 2) {
        if (!val || isNaN(val)) { alert("Vui lòng nhập RPM kế bên HP!"); return; }
        setStatus(`Đang tìm RPM: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Không tìm thấy RPM!"); return; }

        h5gg.editAll('2023', 'F32');
        stepGlitch = 3;
        input.value = "";
        input.placeholder = "Nhập số Nm (Torque)...";
        guide.innerText = `✅ Đã đổi RPM thành 2023!\n\n👉 Bây giờ nhập số lực kéo Nm (Torque) vào ô dưới.`;
        btn.innerText = "Bước 3: Tìm Nm & Đổi thành 2257";
        btn.className = "btn btn-green";
        setStatus("Đã đổi RPM -> 2023");
      }
      // BƯỚC 3: Quét Nm -> Đổi thành 2257
      else if (stepGlitch === 3) {
        if (!val || isNaN(val)) { alert("Vui lòng nhập số Nm!"); return; }
        setStatus(`Đang tìm Nm: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Không tìm thấy Nm!"); return; }

        h5gg.editAll('2257', 'F32');
        stepGlitch = 4;
        input.value = "";
        input.placeholder = "Nhập số RPM bên cạnh Nm...";
        guide.innerText = `✅ Đã đổi Nm thành 2257!\n\n👉 Bây giờ nhập số RPM nằm KẾ BÊN Nm vào ô dưới.`;
        btn.innerText = "Bước 4: Tìm RPM Nm & Đổi thành 2024";
        btn.className = "btn btn-orange";
        setStatus("Đã đổi Nm -> 2257");
      }
      // BƯỚC 4: Quét RPM Nm -> Đổi thành 2024 & Hoàn thành
      else if (stepGlitch === 4) {
        if (!val || isNaN(val)) { alert("Vui lòng nhập số RPM kế bên Nm!"); return; }
        setStatus(`Đang tìm RPM Nm: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Không tìm thấy giá trị!"); return; }

        h5gg.editAll('2024', 'F32');

        alert("GLITCH CAR THÀNH CÔNG!\n\n👉 Hãy quay lại mục Động Cơ (Engine) sẽ thấy các thông số đã được đổi hoàn tất.\n\n⚠️ CHÚ Ý QUAN TRỌNG:\nKhi vào map chạy nhớ BẬT ABS và STABILIZON để tránh bị mất lái / xoay xe!");
        setStatus("Glitch hoàn tất!");
        resetGlitchSteps();
      }
    }

    function resetGlitchSteps() {
      stepGlitch = 1;
      document.getElementById('inputGlitch').value = "";
      document.getElementById('inputGlitch').placeholder = "Nhập HP hiện tại...";
      document.getElementById('btnGlitch').className = "btn btn-green";
      document.getElementById('btnGlitch').innerText = "Bước 1: Tìm HP & Đổi 1515";
      document.getElementById('guideGlitch').innerText = "👉 Hãy mua động cơ V6 3.5 và TẤT CẢ mục OTHER. Sau đó thoát ra ngoài và nhập số HP hiện tại vào ô dưới.";
      setStatus("Sẵn sàng");
    }
  </script>
</body>
</html>
