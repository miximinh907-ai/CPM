<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CPM Glow Mod</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: rgba(18, 18, 24, 0.94);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      border-radius: 14px;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 270px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      text-align: center;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .guide {
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      line-height: 1.4;
      text-align: center;
      white-space: pre-line;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); }
    .btn-glow { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .btn-red { background: linear-gradient(135deg, #dc2626, #b91c1c); margin-top: 6px; }
    .status {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <h3>CPM GLOW MOD</h3>
  
  <div class="guide" id="guideText">Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.</div>
  
  <input type="number" id="glowValInput" value="8" placeholder="Độ sáng (mặc định 8)">

  <button class="btn btn-green" id="actionBtn" onclick="nextGlowStep()">Bước 1: Quét Màu Trắng (Auto Lọc RGBA)</button>
  <button class="btn btn-red" onclick="resetGlowSteps()">Làm lại từ đầu</button>

  <div class="status" id="statusLog">Sẵn sàng</div>

  <script>
    let currentStep = 1;

    function setStatus(msg) {
      document.getElementById('statusLog').innerText = msg;
    }

    function setGuide(msg) {
      document.getElementById('guideText').innerText = msg;
    }

    function nextGlowStep() {
      if (typeof h5gg === 'undefined') {
        alert("Lỗi: H5GG chưa được inject vào game!");
        return;
      }

      const btn = document.getElementById('actionBtn');
      const input = document.getElementById('glowValInput');

      // BƯỚC 1: Quét màu Trắng (1.0) kết hợp Nearby để triệt tiêu 1.3 triệu rác
      if (currentStep === 1) {
        setStatus("Đang quét & khử rác...");
        h5gg.clearResults();
        
        // Quét float 1
        h5gg.searchNumber('1', 'F32', '0x100000000', '0x200000000');
        
        // Ngay lập tức lọc cụm màu RGBA liền kề (khoảng cách 0x20 bytes)
        h5gg.searchNearby('1', 'F32', '0x20');
        
        let count = h5gg.getResultsCount();

        if (count === 0) {
          // Dự phòng nếu dải bộ nhớ máy nằm thấp
          h5gg.clearResults();
          h5gg.searchNumber('1', 'F32', '0x00000000', '0x200000000');
          h5gg.searchNearby('1', 'F32', '0x20');
          count = h5gg.getResultsCount();
        }

        if (count === 0) {
          alert("Không tìm thấy giá trị! Hãy chắc chắn bạn đã kéo thanh màu về trắng hoàn toàn (#FFFFFF).");
          setStatus("Quét thất bại");
          return;
        }

        currentStep = 2;
        setGuide(`Đã lọc siêu sạch còn ${count} kết quả!\n👉 Bây giờ hãy kéo màu về ĐEN (#000000), rồi bấm nút dưới.`);
        btn.innerText = "Bước 2: Lọc Màu Đen (F32 = 0)";
        setStatus(`Còn ${count} kết quả`);
      } 
      // BƯỚC 2: Lọc màu Đen (0.0)
      else if (currentStep === 2) {
        setStatus("Đang lọc giá trị 0...");
        h5gg.searchNumber('0', 'F32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();

        if (count === 0) {
          alert("Lọc thất bại! Hãy chắc chắn bạn đã kéo thanh màu về đen (#000000).");
          resetGlowSteps();
          return;
        }

        currentStep = 3;
        setGuide(`Còn lại ${count} kết quả.\n👉 Bây giờ hãy kéo màu về lại TRẮNG (#FFFFFF), rồi bấm nút dưới.`);
        btn.innerText = "Bước 3: Lọc Màu Trắng (F32 = 1)";
        setStatus(`Còn ${count} kết quả`);
      } 
      // BƯỚC 3: Lọc lại màu Trắng (1.0)
      else if (currentStep === 3) {
        setStatus("Đang lọc giá trị 1...");
        h5gg.searchNumber('1', 'F32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();

        if (count === 0) {
          alert("Lọc thất bại! Vui lòng thử lại.");
          resetGlowSteps();
          return;
        }

        currentStep = 4;
        setGuide(`✅ ĐÃ TÌM ĐƯỢC ${count} ĐỊA CHỈ CHÍNH XÁC!\n\nNhập độ sáng phát sáng (mặc định: 8, 15, 30...) rồi bấm Kích Hoạt.`);
        input.style.display = "block";
        btn.innerText = "Kích Hoạt Phát Sáng (Set = 8)";
        btn.className = "btn btn-glow";
        setStatus(`Còn ${count} địa chỉ`);
      }
      // BƯỚC 4: Ghi đè độ sáng
      else if (currentStep === 4) {
        let val = input.value.trim();
        if (!val || isNaN(val)) {
          alert("Vui lòng nhập giá trị số hợp lệ!");
          return;
        }

        h5gg.editAll(val, 'F32');
        alert(`THÀNH CÔNG!\nĐã chỉnh độ sáng thành ${val}.\n👉 Chạm nhẹ vào ô màu hoặc chuyển tab để xe phát sáng!`);
        setStatus("Mod thành công!");
        resetGlowSteps();
      }
    }

    function resetGlowSteps() {
      currentStep = 1;
      const input = document.getElementById('glowValInput');
      const btn = document.getElementById('actionBtn');
      input.style.display = "none";
      input.value = "8";
      btn.className = "btn btn-green";
      btn.innerText = "Bước 1: Quét Màu Trắng (Auto Lọc RGBA)";
      setGuide("Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.");
      setStatus("Sẵn sàng");
    }
  </script>
</body>
</html>
