<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mod CPK Beta by Minh Do x Gemini</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 10px;
      border-radius: 16px;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      width: 360px;
      font-size: 11px;
    }
    .layout-container {
      display: flex;
      gap: 10px;
      height: 250px;
    }
    /* SIDEBAR */
    .sidebar {
      width: 110px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding-right: 8px;
    }
    .brand-title {
      font-size: 11px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .nav-btn {
      padding: 9px 4px;
      font-size: 10px;
      font-weight: 600;
      border: none;
      background: rgba(30, 41, 59, 0.6);
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }
    /* CONTENT AREA */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    
    .guide-box {
      font-size: 10.5px;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 8px;
      line-height: 1.35;
      text-align: center;
      white-space: pre-line;
    }
    .input-field {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
      text-align: center;
      outline: none;
    }
    .action-btn {
      width: 100%;
      padding: 9px 4px;
      margin-bottom: 5px;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
    .btn-purple { background: linear-gradient(135deg, #a855f7, #7c3aed); }
    .btn-red { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 6px; font-size: 10px; }
    
    .status-bar {
      font-size: 9.5px;
      color: #64748b;
      text-align: center;
      margin-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 4px;
    }
  </style>
</head>
<body>

  <div class="layout-container">
    <div class="sidebar">
      <div class="brand-title">MOD CPK<br>v4.9.7</div>
      <button class="nav-btn active" onclick="switchNav('bumperTab', this)">Gỡ Cản Trước</button>
      <button class="nav-btn" onclick="switchNav('bodyTab', this)">Mod Body</button>
      <button class="nav-btn" onclick="switchNav('glowTab', this)">Phát Sáng</button>
    </div>

    <div class="content-area">
      <!-- TAB 1: GỠ CẢN TRƯỚC (LẶP 0 <-> 1 MƯỢT KHÔNG CRASH) -->
      <div id="bumperTab" class="tab-panel active">
        <div class="guide-box" id="guideBumper">👉 Chọn xe mặc định $\rightarrow$ Vào cản trước $\rightarrow$ Bấm CẢN 1 rồi bấm nút bên dưới:</div>
        <button class="action-btn btn-green" id="btnBumperAction" onclick="handleBumperToggle()">Bước 1: Quét Cản 1 (D-Word: 0)</button>
        <button class="action-btn btn-red" onclick="resetBumperSteps()">Làm lại từ đầu</button>
      </div>

      <!-- TAB 2: MOD BODY -->
      <div id="bodyTab" class="tab-panel">
        <div class="guide-box" id="guideBody">Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.</div>
        <button class="action-btn btn-green" id="btnBody" onclick="nextBodyStep()">Bước 1: Quét Cản 2 (I32 = 1)</button>
        <button class="action-btn btn-red" onclick="resetBodySteps()">Làm lại từ đầu</button>
      </div>

      <!-- TAB 3: PHÁT SÁNG -->
      <div id="glowTab" class="tab-panel">
        <div class="guide-box" id="guideGlow">Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.</div>
        <input type="number" id="inputGlow" class="input-field" value="38" placeholder="Độ sáng" style="display:none;">
        <button class="action-btn btn-green" id="btnGlow" onclick="nextGlowStep()">Bước 1: Quét Trắng (F32 = 1)</button>
        <button class="action-btn btn-red" onclick="resetGlowSteps()">Làm lại từ đầu</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="statusLog">Sẵn sàng hoạt động</div>

  <script>
    const ANON_MIN = '0x100000000';
    const ANON_MAX = '0x200000000';

    function setStatus(msg) { document.getElementById('statusLog').innerText = msg; }
    function hideKeyboard() { if (document.activeElement) document.activeElement.blur(); }

    function switchNav(tabId, btn) {
      hideKeyboard();
      document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      setStatus("Đã chuyển tab");
    }

    // ================= LOGIC GỠ CẢN: LẶP 0 <-> 1 ĐẾN KHI CÒN 1 ADDRESS =================
    let isBumperFirstScan = true;
    let expectedValue = '0'; // '0' cho Cản 1, '1' cho Cản 2

    function handleBumperToggle() {
      if (typeof h5gg === 'undefined') { alert("H5GG chưa load!"); return; }
      hideKeyboard();
      
      const btn = document.getElementById('btnBumperAction');
      const guide = document.getElementById('guideBumper');
      
      btn.disabled = true;

      // Xử lý quét lần đầu: Search 0
      if (isBumperFirstScan) {
        setStatus("Đang quét Cản 1 (D-Word: 0)...");
        
        setTimeout(() => {
          h5gg.clearResults();
          h5gg.searchNumber('0', 'I32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();
          
          if (count === 0) {
            alert("Không tìm thấy giá trị 0! Hãy chọn Cản 1 rồi thử lại.");
            btn.disabled = false;
            return;
          }

          isBumperFirstScan = false;
          expectedValue = '1'; // Bước tiếp theo cần chọn Cản 2 (Refine 1)

          guide.innerText = `Tìm thấy ${count} kết quả.\n👉 Trong game bấm chọn CẢN SỐ 2 rồi bấm nút dưới:`;
          btn.innerText = "Lọc Cản 2 (D-Word: 1)";
          btn.className = "action-btn btn-orange";
          btn.disabled = false;
          setStatus(`Còn ${count} kết quả`);
        }, 100);
      } 
      // Xử lý các lần lọc lặp lại xen kẽ giữa 1 và 0
      else {
        setStatus(`Đang lọc Cản (D-Word: ${expectedValue})...`);
        
        setTimeout(() => {
          h5gg.searchNumber(expectedValue, 'I32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();

          if (count === 0) {
            alert("Lọc thất bại! Hãy kiểm tra lại đã chọn đúng cản trong game chưa.");
            resetBumperSteps();
            return;
          }

          // KHI ĐÃ LỌC CÒN ĐÚNG 1 ADDRESS DUY NHẤT
          if (count === 1) {
            h5gg.editAll('-1', 'I32');
            alert("✅ GỠ CẢN THÀNH CÔNG!\n\nĐã khóa đúng 1 Address và đổi thành -1.\nCản trước đã được gỡ bỏ hoàn toàn!");
            setStatus("Đã gỡ cản (-1)");
            resetBumperSteps();
            return;
          }

          // Đảo chiều trạng thái cản cho lần bấm tiếp theo
          if (expectedValue === '1') {
            expectedValue = '0';
            guide.innerText = `Còn ${count} kết quả.\n👉 Trong game bấm chọn lại CẢN SỐ 1 rồi bấm nút dưới:`;
            btn.innerText = "Lọc Cản 1 (D-Word: 0)";
          } else {
            expectedValue = '1';
            guide.innerText = `Còn ${count} kết quả.\n👉 Trong game bấm chọn lại CẢN SỐ 2 rồi bấm nút dưới:`;
            btn.innerText = "Lọc Cản 2 (D-Word: 1)";
          }

          btn.className = "action-btn btn-orange";
          btn.disabled = false;
          setStatus(`Còn ${count} kết quả`);
        }, 100);
      }
    }

    function resetBumperSteps() {
      hideKeyboard();
      isBumperFirstScan = true;
      expectedValue = '0';
      const btn = document.getElementById('btnBumperAction');
      btn.disabled = false;
      btn.innerText = "Bước 1: Quét Cản 1 (D-Word: 0)";
      btn.className = "action-btn btn-green";
      document.getElementById('guideBumper').innerText = "👉 Chọn xe mặc định $\\rightarrow$ Vào cản trước $\\rightarrow$ Bấm CẢN 1 rồi bấm nút bên dưới:";
      setStatus("Sẵn sàng");
    }

    // ================= LOGIC MOD BODY =================
    let stepBody = 1;
    function nextBodyStep() {
      if (typeof h5gg === 'undefined') { alert("H5GG chưa load!"); return; }
      hideKeyboard();
      const btn = document.getElementById('btnBody');
      const guide = document.getElementById('guideBody');

      if (stepBody === 1) {
        setStatus("Đang quét cản 2...");
        setTimeout(() => {
          h5gg.clearResults();
          h5gg.searchNumber('1', 'I32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();
          if (count === 0) { alert("Không tìm thấy!"); return; }
          stepBody = 2;
          guide.innerText = `Tìm thấy ${count} kết quả.\n👉 Chọn CẢN SỐ 3 rồi bấm nút dưới.`;
          btn.innerText = "Bước 2: Lọc Cản 3 (Refine 2)";
        }, 100);
      } else if (stepBody >= 2 && stepBody <= 5) {
        setTimeout(() => {
          h5gg.searchNumber(stepBody.toString(), 'I32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();
          if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
          stepBody++;
          guide.innerText = `Còn ${count} kết quả.\n👉 Chọn CẢN SỐ ${stepBody} rồi bấm nút dưới.`;
          btn.innerText = `Bước ${stepBody - 1}: Lọc Cản ${stepBody}`;
        }, 100);
      } else if (stepBody === 6) {
        stepBody = 7;
        guide.innerText = "👉 Ra gara chọn xe muốn độ Body rồi bấm Áp Dụng:";
        btn.innerText = "Áp Dụng ID Body";
        btn.className = "action-btn btn-orange";
      } else if (stepBody === 7) {
        h5gg.editAll('-1', 'I32');
        alert("ĐÃ MOD BODY THÀNH CÔNG!");
        resetBodySteps();
      }
    }

    function resetBodySteps() {
      hideKeyboard();
      stepBody = 1;
      document.getElementById('btnBody').innerText = "Bước 1: Quét Cản 2 (I32 = 1)";
      document.getElementById('btnBody').className = "action-btn btn-green";
      document.getElementById('guideBody').innerText = "Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.";
      setStatus("Sẵn sàng");
    }

    // ================= LOGIC PHÁT SÁNG =================
    let stepGlow = 1;
    const seqGlow = ['1', '0', '1', '0', '1', '0', '1'];
    function nextGlowStep() {
      if (typeof h5gg === 'undefined') { alert("H5GG chưa load!"); return; }
      hideKeyboard();
      const btn = document.getElementById('btnGlow');
      const input = document.getElementById('inputGlow');
      const guide = document.getElementById('guideGlow');

      if (stepGlow === 1) {
        setStatus("Đang quét...");
        setTimeout(() => {
          h5gg.clearResults();
          h5gg.searchNumber('1', 'F32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();
          if (count === 0) { alert("Không tìm thấy giá trị 1! Nhớ kéo màu về Trắng."); return; }
          stepGlow = 2;
          guide.innerText = `Còn ${count} kết quả.\n👉 Kéo màu về ĐEN (#000000) rồi bấm nút dưới.`;
          btn.innerText = "Bước 2: Lọc Đen (F32 = 0)";
        }, 100);
      } else if (stepGlow >= 2 && stepGlow <= 7) {
        let target = seqGlow[stepGlow - 1];
        setTimeout(() => {
          h5gg.searchNumber(target, 'F32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();
          if (count === 0) { alert("Lọc thất bại!"); resetGlowSteps(); return; }
          if (stepGlow === 7) {
            stepGlow = 8;
            guide.innerText = `✅ ĐÃ KHÓA SẠCH ${count} ĐỊA CHỈ!\nNhập độ sáng rồi bấm Kích Hoạt.`;
            input.style.display = "block";
            btn.innerText = "Kích Hoạt Phát Sáng";
            btn.className = "action-btn btn-purple";
          } else {
            stepGlow++;
            let nextVal = seqGlow[stepGlow - 1];
            guide.innerText = `Còn ${count} kết quả.\n👉 Kéo màu về ${nextVal === '1' ? 'TRẮNG' : 'ĐEN'} rồi bấm nút.`;
            btn.innerText = `Bước ${stepGlow}: Lọc ${nextVal === '1' ? 'Trắng' : 'Đen'} (F32 = ${nextVal})`;
          }
        }, 100);
      } else if (stepGlow === 8) {
        let val = input.value.trim() || "38";
        h5gg.editAll(val, 'F32');
        alert("ĐÃ KÍCH HOẠT PHÁT SÁNG!");
        resetGlowSteps();
      }
    }

    function resetGlowSteps() {
      hideKeyboard();
      stepGlow = 1;
      document.getElementById('inputGlow').style.display = "none";
      document.getElementById('inputGlow').value = "38";
      document.getElementById('btnGlow').innerText = "Bước 1: Quét Trắng (F32 = 1)";
      document.getElementById('btnGlow').className = "action-btn btn-green";
      document.getElementById('guideGlow').innerText = "Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.";
      setStatus("Sẵn sàng");
    }
  </script>
</body>
</html>
