
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CPM Mod Menu All-In-One</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: rgba(18, 18, 24, 0.95);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      border-radius: 14px;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 290px;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      text-align: center;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 2px;
      font-size: 10px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #1e293b;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #38bdf8;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .guide {
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      line-height: 1.4;
      text-align: center;
      white-space: pre-line;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); }
    .btn-orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
    .btn-glow { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .btn-red { background: linear-gradient(135deg, #dc2626, #b91c1c); margin-top: 6px; }
    .status {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      text-align: center;
      display: none;
    }
    #inputHp { display: block; }
  </style>
</head>
<body>

  <h3>CPM ALL-IN-ONE MENU</h3>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnBody" onclick="switchTab('body')">Mod Body</button>
    <button class="tab-btn" id="tabBtnGlow" onclick="switchTab('glow')">Phát Sáng</button>
    <button class="tab-btn" id="tabBtnHp" onclick="switchTab('hp')">Mod HP</button>
  </div>

  <!-- TAB 1: MOD BODY XE -->
  <div id="tabBody" class="tab-content active">
    <div class="guide" id="guideBody">Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.</div>
    <input type="number" id="inputBody" placeholder="Nhập ID Body muốn mod...">
    <button class="btn btn-green" id="btnBody" onclick="nextBodyStep()">Bước 1: Quét Cản 2 (Search 1)</button>
    <button class="btn btn-red" onclick="resetBodySteps()">Làm lại từ đầu</button>
  </div>

  <!-- TAB 2: MOD PHÁT SÁNG (ANONYMOUS & FLOAT) -->
  <div id="tabGlow" class="tab-content">
    <div class="guide" id="guideGlow">Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.</div>
    <input type="number" id="inputGlow" value="8" placeholder="Độ sáng (mặc định 8)">
    <button class="btn btn-green" id="btnGlow" onclick="nextGlowStep()">Bước 1: Quét Màu Trắng (F32 = 1)</button>
    <button class="btn btn-red" onclick="resetGlowSteps()">Làm lại từ đầu</button>
  </div>

  <!-- TAB 3: MOD HP ĐỘNG CƠ (ANONYMOUS & FLOAT) -->
  <div id="tabHp" class="tab-content">
    <div class="guide" id="guideHp">👉 Vào map, mở bảng thông số HP/Nm xe rồi nhập số HP hiện tại vào ô dưới.</div>
    <input type="number" id="inputHp" placeholder="Nhập HP hiện tại (1 - 2000)">
    <button class="btn btn-green" id="btnHp" onclick="nextHpStep()">Bước 1: Tìm HP & Đổi thành 414</button>
    <button class="btn btn-red" onclick="resetHpSteps()">Làm lại từ đầu</button>
  </div>

  <div class="status" id="statusLog">Sẵn sàng</div>

  <script>
    // Định nghĩa dải RAM Anonymous chuẩn cho iOS H5GG
    const ANON_MIN = '0x100000000';
    const ANON_MAX = '0x200000000';

    function setStatus(msg) {
      document.getElementById('statusLog').innerText = msg;
    }

    function switchTab(tab) {
      document.getElementById('tabBody').classList.remove('active');
      document.getElementById('tabGlow').classList.remove('active');
      document.getElementById('tabHp').classList.remove('active');
      
      document.getElementById('tabBtnBody').classList.remove('active');
      document.getElementById('tabBtnGlow').classList.remove('active');
      document.getElementById('tabBtnHp').classList.remove('active');

      if (tab === 'body') {
        document.getElementById('tabBody').classList.add('active');
        document.getElementById('tabBtnBody').classList.add('active');
      } else if (tab === 'glow') {
        document.getElementById('tabGlow').classList.add('active');
        document.getElementById('tabBtnGlow').classList.add('active');
      } else if (tab === 'hp') {
        document.getElementById('tabHp').classList.add('active');
        document.getElementById('tabBtnHp').classList.add('active');
      }
      setStatus("Đã chuyển tab");
    }

    // ==========================================
    // 1. LOGIC MOD BODY XE (I32)
    // ==========================================
    let stepBody = 1;

    function nextBodyStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      const btn = document.getElementById('btnBody');
      const input = document.getElementById('inputBody');
      const guide = document.getElementById('guideBody');

      if (stepBody === 1) {
        setStatus("Đang quét giá trị 1...");
        h5gg.clearResults();
        h5gg.searchNumber('1', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Không tìm thấy!"); return; }
        stepBody = 2;
        guide.innerText = `Tìm thấy ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 3, rồi bấm nút dưới.`;
        btn.innerText = "Bước 2: Lọc Cản 3 (Refine 2)";
      } else if (stepBody === 2) {
        setStatus("Đang lọc giá trị 2...");
        h5gg.searchNumber('2', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 3;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 4, rồi bấm nút dưới.`;
        btn.innerText = "Bước 3: Lọc Cản 4 (Refine 3)";
      } else if (stepBody === 3) {
        setStatus("Đang lọc giá trị 3...");
        h5gg.searchNumber('3', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 4;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 5, rồi bấm nút dưới.`;
        btn.innerText = "Bước 4: Lọc Cản 5 (Refine 4)";
      } else if (stepBody === 4) {
        setStatus("Đang lọc giá trị 4...");
        h5gg.searchNumber('4', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 5;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chạm vào game CHỌN CẢN SỐ 6, rồi bấm nút dưới.`;
        btn.innerText = "Bước 5: Lọc Cản 6 (Refine 5)";
      } else if (stepBody === 5) {
        setStatus("Đang lọc giá trị 5...");
        h5gg.searchNumber('5', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Lọc thất bại!"); resetBodySteps(); return; }
        stepBody = 6;
        guide.innerText = `✅ ĐÃ TÌM ĐƯỢC ${count} ĐỊA CHỈ!\n\n👉 Thoát ra ngoài, CHỌN XE CÓ HỐC GIÓ bạn muốn mod.\n👉 Chọn xong bấm nút xác nhận bên dưới.`;
        btn.innerText = "Đã Chọn Xe (Tiếp tục)";
        btn.className = "btn btn-orange";
      } else if (stepBody === 6) {
        stepBody = 7;
        guide.innerText = "👉 Nhập số ID Body muốn mod vào ô bên dưới, sau đó bấm Áp Dụng.";
        input.style.display = "block";
        btn.innerText = "Áp Dụng Body Mod";
        btn.className = "btn btn-green";
      } else if (stepBody === 7) {
        let val = input.value.trim();
        if (!val || isNaN(val)) { alert("Vui lòng nhập số ID hợp lệ!"); return; }
        h5gg.editAll(val, 'I32');
        alert(`ĐÃ THAY ĐỔI THÀNH CÔNG SANG BODY ID: ${val}`);
        resetBodySteps();
      }
    }

    function resetBodySteps() {
      stepBody = 1;
      document.getElementById('inputBody').style.display = "none";
      document.getElementById('inputBody').value = "";
      document.getElementById('btnBody').className = "btn btn-green";
      document.getElementById('btnBody').innerText = "Bước 1: Quét Cản 2 (Search 1)";
      document.getElementById('guideBody').innerText = "Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.";
      setStatus("Sẵn sàng");
    }

    // ==========================================
    // 2. LOGIC MOD PHÁT SÁNG (ANONYMOUS & F32)
    // ==========================================
    let stepGlow = 1;
    const sequenceGlow = [
      { val: '1', name: 'TRẮNG (#FFFFFF)' }, { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' }, { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' }, { val: '0', name: 'ĐEN (#000000)' },
      { val: '1', name: 'TRẮNG (#FFFFFF)' }
    ];

    function nextGlowStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      const btn = document.getElementById('btnGlow');
      const input = document.getElementById('inputGlow');
      const guide = document.getElementById('guideGlow');

      if (stepGlow === 1) {
        setStatus("Đang quét Anonymous F32 = 1...");
        setTimeout(() => {
          h5gg.clearResults();
          // Quét trong phạm vi Anonymous (ANON_MIN -> ANON_MAX)
          h5gg.searchNumber('1', 'F32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();

          if (count === 0) { alert("Không tìm thấy giá trị 1! Hãy chắc chắn kéo màu về TRẮNG (#FFFFFF)."); return; }
          stepGlow = 2;
          guide.innerText = `Còn ${count} kết quả.\n👉 Bây giờ hãy kéo màu về ĐEN (#000000), rồi bấm nút dưới.`;
          btn.innerText = "Bước 2: Lọc Màu Đen (F32 = 0)";
        }, 100);
      } else if (stepGlow >= 2 && stepGlow <= 7) {
        let currentTarget = sequenceGlow[stepGlow - 1].val;
        setStatus(`Đang lọc Anonymous Float ${currentTarget}...`);
        setTimeout(() => {
          h5gg.searchNumber(currentTarget, 'F32', ANON_MIN, ANON_MAX);
          let count = h5gg.getResultsCount();
          if (count === 0) { alert(`Lọc thất bại!`); resetGlowSteps(); return; }
          if (stepGlow === 7) {
            stepGlow = 8;
            guide.innerText = `✅ ĐÃ LỌC XONG (Còn ${count} địa chỉ)!\n\nNhập độ sáng (mặc định: 8) rồi bấm Kích Hoạt.`;
            input.style.display = "block";
            btn.innerText = "Kích Hoạt Phát Sáng (Set = 8)";
            btn.className = "btn btn-glow";
          } else {
            stepGlow++;
            const nextTarget = sequenceGlow[stepGlow - 1];
            guide.innerText = `Còn ${count} kết quả.\n👉 Kéo màu về ${nextTarget.name}, rồi bấm nút dưới.`;
            btn.innerText = `Bước ${stepGlow}: Lọc Màu ${nextTarget.val === '1' ? 'Trắng' : 'Đen'} (F32 = ${nextTarget.val})`;
          }
        }, 100);
      } else if (stepGlow === 8) {
        let val = input.value.trim();
        if (!val || isNaN(val)) { alert("Vui lòng nhập số hợp lệ!"); return; }
        h5gg.editAll(val, 'F32');
        alert(`THÀNH CÔNG!\nĐã chỉnh độ sáng thành ${val}.`);
        resetGlowSteps();
      }
    }

    function resetGlowSteps() {
      stepGlow = 1;
      document.getElementById('inputGlow').style.display = "none";
      document.getElementById('inputGlow').value = "8";
      document.getElementById('btnGlow').className = "btn btn-green";
      document.getElementById('btnGlow').innerText = "Bước 1: Quét Màu Trắng (F32 = 1)";
      document.getElementById('guideGlow').innerText = "Kéo màu chi tiết về TRẮNG (#FFFFFF) rồi bấm nút dưới.";
      setStatus("Sẵn sàng");
    }

    // ==========================================
    // 3. LOGIC MOD HP XE (ANONYMOUS & F32)
    // ==========================================
    let stepHp = 1;

    function nextHpStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được inject!"); return; }
      const btn = document.getElementById('btnHp');
      const input = document.getElementById('inputHp');
      const guide = document.getElementById('guideHp');
      let val = input.value.trim();

      if (stepHp === 1) {
        if (!val || isNaN(val) || Number(val) < 1 || Number(val) > 2000) { alert("Vui lòng nhập HP hợp lệ (1 - 2000)!"); return; }
        setStatus(`Đang tìm Anonymous F32: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        if (h5gg.getResultsCount() === 0) { alert("Không tìm thấy HP trong vùng Anonymous!"); return; }
        
        h5gg.editAll('414', 'F32');
        stepHp = 2;
        input.value = "";
        input.placeholder = "Nhập số RPM bên cạnh HP...";
        guide.innerText = `✅ Đã đổi HP thành 414!\n\n👉 Nhập số RPM kế bên HP vào ô dưới.`;
        btn.innerText = "Bước 2: Tìm RPM & Đổi thành 8000";
        btn.className = "btn btn-orange";
      } 
      else if (stepHp === 2) {
        if (!val || isNaN(val)) { alert("Nhập số RPM hợp lệ!"); return; }
        setStatus(`Đang tìm RPM: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        if (h5gg.getResultsCount() === 0) { alert("Không tìm thấy RPM!"); return; }

        h5gg.editAll('8000', 'F32');
        stepHp = 3;
        input.value = "";
        input.placeholder = "Nhập số Nm (Torque)...";
        guide.innerText = `✅ Đã đổi RPM thành 8000!\n\n👉 Nhập chỉ số lực kéo Nm (Torque) vào ô dưới.`;
        btn.innerText = "Bước 3: Tìm Nm & Đổi thành 2300";
        btn.className = "btn btn-green";
      } 
      else if (stepHp === 3) {
        if (!val || isNaN(val)) { alert("Nhập số Nm hợp lệ!"); return; }
        setStatus(`Đang tìm Nm: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        if (h5gg.getResultsCount() === 0) { alert("Không tìm thấy Nm!"); return; }

        h5gg.editAll('2300', 'F32');
        stepHp = 4;
        input.value = "";
        input.placeholder = "Nhập số RPM bên cạnh Nm...";
        guide.innerText = `✅ Đã đổi Nm thành 2300!\n\n👉 Nhập số RPM kế bên Nm vào ô dưới.`;
        btn.innerText = "Bước 4: Tìm RPM Nm & Đổi thành 7998";
        btn.className = "btn btn-orange";
      } 
      else if (stepHp === 4) {
        if (!val || isNaN(val)) { alert("Nhập số RPM hợp lệ!"); return; }
        setStatus(`Đang tìm RPM Nm: ${val}...`);
        h5gg.clearResults();
        h5gg.searchNumber(val, 'F32', ANON_MIN, ANON_MAX);
        if (h5gg.getResultsCount() === 0) { alert("Không tìm thấy giá trị!"); return; }

        h5gg.editAll('7998', 'F32');
        alert("Đã thay đổi hp thành công!");
        resetHpSteps();
      }
    }

    function resetHpSteps() {
      stepHp = 1;
      document.getElementById('inputHp').value = "";
      document.getElementById('inputHp').placeholder = "Nhập HP hiện tại (1 - 2000)";
      document.getElementById('btnHp').className = "btn btn-green";
      document.getElementById('btnHp').innerText = "Bước 1: Tìm HP & Đổi thành 414";
      document.getElementById('guideHp').innerText = "👉 Vào map, mở bảng thông số HP/Nm xe rồi nhập số HP hiện tại vào ô dưới.";
      setStatus("Sẵn sàng");
    }
  </script>
</body>
</html>
