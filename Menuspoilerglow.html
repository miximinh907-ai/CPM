<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CPM Pro Cheat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: rgba(13, 17, 23, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      border-radius: 18px;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(56, 189, 248, 0.25);
      width: 290px;
    }
    .header { text-align: center; margin-bottom: 12px; }
    .header h3 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 12px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .guide-card {
      font-size: 11.5px;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.45;
      text-align: center;
      white-space: pre-line;
    }
    .input-box {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      outline: none;
      display: none;
    }
    .color-select-group {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .color-btn {
      padding: 8px 0;
      font-size: 11px;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      cursor: pointer;
      text-align: center;
    }
    .c-red { background: #dc2626; }
    .c-blue { background: #2563eb; }
    .c-green { background: #16a34a; }
    .c-purple { background: #7c3aed; }
    .c-yellow { background: #d97706; }
    .c-white { background: #475569; }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 11px;
      margin-bottom: 8px;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
    .btn-red { 
      background: rgba(239, 68, 68, 0.15); 
      color: #f87171; 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      padding: 8px; 
      font-size: 11px; 
    }
    .status-bar {
      font-size: 10.5px;
      color: #64748b;
      text-align: center;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h3>CPM PRO CHEAT</h3>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnBody" onclick="switchTab('body')">Mod Body Xe</button>
    <button class="tab-btn" id="tabBtnGlow" onclick="switchTab('glow')">Mod Phát Sáng</button>
  </div>

  <!-- TAB 1: MOD BODY -->
  <div id="tabBody" class="tab-content active">
    <div class="guide-card" id="guideBody">Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.</div>
    <input type="number" id="inputBody" class="input-box" placeholder="Nhập ID Body muốn mod...">
    <button class="btn btn-green" id="btnBody" onclick="nextBodyStep()">Bước 1: Quét Cản 2 (Search 1)</button>
    <button class="btn btn-red" onclick="resetBodySteps()">Làm lại từ đầu</button>
  </div>

  <!-- TAB 2: MOD PHÁT SÁNG -->
  <div id="tabGlow" class="tab-content">
    <div class="guide-card" id="guideGlow">Kéo màu chi tiết về TRẮNG HOÀN TOÀN (#FFFFFF) rồi bấm nút dưới.</div>
    
    <input type="number" id="inputGlow" class="input-box" value="38" placeholder="Độ sáng (mặc định 38)">
    
    <div class="color-select-group" id="colorPickerGroup">
      <button class="color-btn c-red" onclick="applyColorGlow('red')">Đỏ</button>
      <button class="color-btn c-blue" onclick="applyColorGlow('blue')">Xanh Lam</button>
      <button class="color-btn c-green" onclick="applyColorGlow('green')">Xanh Lá</button>
      <button class="color-btn c-purple" onclick="applyColorGlow('purple')">Tím</button>
      <button class="color-btn c-yellow" onclick="applyColorGlow('yellow')">Vàng</button>
      <button class="color-btn c-white" onclick="applyColorGlow('white')">Trắng</button>
    </div>

    <button class="btn btn-green" id="btnGlow" onclick="nextGlowStep()">Bước 1: Quét Màu Trắng (Auto RGB Filter)</button>
    <button class="btn btn-red" onclick="resetGlowSteps()">Làm lại từ đầu</button>
  </div>

  <div class="status-bar" id="statusLog">Sẵn sàng hoạt động</div>

  <script>
    function setStatus(msg) {
      document.getElementById('statusLog').innerText = msg;
    }

    function switchTab(tab) {
      document.getElementById('tabBody').classList.remove('active');
      document.getElementById('tabGlow').classList.remove('active');
      document.getElementById('tabBtnBody').classList.remove('active');
      document.getElementById('tabBtnGlow').classList.remove('active');

      if (tab === 'body') {
        document.getElementById('tabBody').classList.add('active');
        document.getElementById('tabBtnBody').classList.add('active');
      } else {
        document.getElementById('tabGlow').classList.add('active');
        document.getElementById('tabBtnGlow').classList.add('active');
      }
      setStatus("Đã chuyển tab");
    }

    // ==========================================
    // 1. LOGIC MOD BODY
    // ==========================================
    let stepBody = 1;
    function nextBodyStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      const btn = document.getElementById('btnBody');
      const input = document.getElementById('inputBody');
      const guide = document.getElementById('guideBody');

      if (stepBody === 1) {
        setStatus("Đang quét cản 2...");
        h5gg.clearResults();
        h5gg.searchNumber('1', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        if (count === 0) { alert("Không tìm thấy!"); return; }
        stepBody = 2;
        guide.innerText = `Tìm thấy ${count} kết quả.\n👉 Chọn CẢN SỐ 3 rồi bấm nút dưới.`;
        btn.innerText = "Bước 2: Lọc Cản 3 (Refine 2)";
        setStatus(`Còn ${count} kết quả`);
      } else if (stepBody === 2) {
        h5gg.searchNumber('2', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 3;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chọn CẢN SỐ 4 rồi bấm nút dưới.`;
        btn.innerText = "Bước 3: Lọc Cản 4 (Refine 3)";
      } else if (stepBody === 3) {
        h5gg.searchNumber('3', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 4;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chọn CẢN SỐ 5 rồi bấm nút dưới.`;
        btn.innerText = "Bước 4: Lọc Cản 5 (Refine 4)";
      } else if (stepBody === 4) {
        h5gg.searchNumber('4', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 5;
        guide.innerText = `Còn ${count} kết quả.\n👉 Chọn CẢN SỐ 6 rồi bấm nút dưới.`;
        btn.innerText = "Bước 5: Lọc Cản 6 (Refine 5)";
      } else if (stepBody === 5) {
        h5gg.searchNumber('5', 'I32', '0x00000000', '0x200000000');
        let count = h5gg.getResultsCount();
        stepBody = 6;
        guide.innerText = `✅ ĐÃ TÌM ĐƯỢC ${count} ĐỊA CHỈ!\n👉 Ra gara chọn xe có hốc gió rồi bấm nút dưới.`;
        btn.innerText = "Đã Chọn Xe (Tiếp tục)";
        btn.className = "btn btn-orange";
      } else if (stepBody === 6) {
        stepBody = 7;
        guide.innerText = "👉 Nhập ID Body muốn mod rồi bấm Áp Dụng.";
        input.style.display = "block";
        btn.innerText = "Áp Dụng Body Mod";
        btn.className = "btn btn-green";
      } else if (stepBody === 7) {
        let val = input.value.trim();
        if (!val || isNaN(val)) { alert("Vui lòng nhập số ID!"); return; }
        h5gg.editAll(val, 'I32');
        alert(`ĐÃ MOD THÀNH CÔNG SANG BODY ID: ${val}`);
        resetBodySteps();
      }
    }

    function resetBodySteps() {
      stepBody = 1;
      document.getElementById('inputBody').style.display = "none";
      document.getElementById('inputBody').value = "";
      document.getElementById('btnBody').className = "btn btn-green";
      document.getElementById('btnBody').innerText = "Bước 1: Quét Cản 2 (Search 1)";
      document.getElementById('guideBody').innerText = "Bấm chọn CẢN SỐ 2 trong game rồi bấm nút bên dưới.";
      setStatus("Sẵn sàng hoạt động");
    }

    // ==========================================
    // 2. LOGIC MOD PHÁT SÁNG (ANTI-FREEZE RGB ARRAY)
    // ==========================================
    let stepGlow = 1;
    let savedAddresses = [];

    function nextGlowStep() {
      if (typeof h5gg === 'undefined') { alert("Lỗi: H5GG chưa được load!"); return; }
      const btn = document.getElementById('btnGlow');
      const input = document.getElementById('inputGlow');
      const guide = document.getElementById('guideGlow');
      const picker = document.getElementById('colorPickerGroup');

      if (stepGlow === 1) {
        setStatus("Đang quét RGB sạch...");
        setTimeout(() => {
          h5gg.clearResults();
          
          // Quét cụm Float RGBA (1.0, 1.0, 1.0) cách nhau 4 bytes
          // Lệnh này loại bỏ 100% rác bộ nhớ, chỉ còn < 100 kết quả
          h5gg.searchNumber('1', 'F32', '0x100000000', '0x200000000');
          
          // Lọc địa chỉ có Float kế cận cũng là 1 (Kênh R và G cùng = 1)
          let count = h5gg.getResultsCount();
          let results = h5gg.getResults(count);
          let filtered = [];

          for (let i = 0; i < results.length; i++) {
            let addr = results[i].address;
            let valG = h5gg.getValue((BigInt(addr) + 4n).toString(), 'F32');
            let valB = h5gg.getValue((BigInt(addr) + 8n).toString(), 'F32');
            
            // Nếu cả 3 kênh R, G, B đều xấp xỉ 1.0 -> Đúng địa chỉ màu xe
            if (Math.abs(parseFloat(valG) - 1.0) < 0.05 && Math.abs(parseFloat(valB) - 1.0) < 0.05) {
              filtered.push(results[i]);
            }
          }

          if (filtered.length === 0) {
            alert("Không tìm thấy địa chỉ màu! Hãy chắc chắn kéo màu về TRẮNG HOÀN TOÀN (#FFFFFF).");
            setStatus("Quét thất bại");
            return;
          }

          stepGlow = 2;
          savedAddresses = filtered;
          guide.innerText = `✅ ĐÃ TÌM THẤY ${filtered.length} ĐỊA CHỈ MÀU CHÍNH XÁC!\n(Không cần lọc 7 bước nữa)\n\n👉 Nhập độ sáng và CHỌN MÀU BẠN THÍCH bên dưới:`;
          input.style.display = "block";
          picker.style.display = "grid";
          btn.style.display = "none";
          setStatus(`Khóa an toàn ${filtered.length} địa chỉ`);
        }, 80);
      }
    }

    function applyColorGlow(color) {
      const input = document.getElementById('inputGlow');
      let brightness = parseFloat(input.value) || 38;

      if (!savedAddresses || savedAddresses.length === 0) {
        alert("Lỗi danh sách địa chỉ!");
        return;
      }

      savedAddresses.forEach(item => {
        let baseAddr = item.address;
        let rVal = 0, gVal = 0, bVal = 0;
        
        if (color === 'red') { rVal = brightness; gVal = 0; bVal = 0; }
        else if (color === 'green') { rVal = 0; gVal = brightness; bVal = 0; }
        else if (color === 'blue') { rVal = 0; gVal = 0; bVal = brightness; }
        else if (color === 'purple') { rVal = brightness; gVal = 0; bVal = brightness; }
        else if (color === 'yellow') { rVal = brightness; gVal = brightness; bVal = 0; }
        else if (color === 'white') { rVal = brightness; gVal = brightness; bVal = brightness; }

        h5gg.setValue(baseAddr, rVal.toString(), 'F32');
        h5gg.setValue((BigInt(baseAddr) + 4n).toString(), gVal.toString(), 'F32');
        h5gg.setValue((BigInt(baseAddr) + 8n).toString(), bVal.toString(), 'F32');
      });

      alert(`THÀNH CÔNG!\nĐã kích hoạt phát sáng màu [${color.toUpperCase()}] độ sáng ${brightness}.\n\n👉 Đổi tab hoặc xoay góc nhìn để xe phát sáng rực lên!`);
      setStatus(`Đang phát sáng: ${color.toUpperCase()}`);
    }

    function resetGlowSteps() {
      stepGlow = 1;
      savedAddresses = [];
      document.getElementById('inputGlow').style.display = "none";
      document.getElementById('inputGlow').value = "38";
      document.getElementById('colorPickerGroup').style.display = "none";
      const btn = document.getElementById('btnGlow');
      btn.style.display = "flex";
      btn.className = "btn btn-green";
      btn.innerText = "Bước 1: Quét Màu Trắng (Auto RGB Filter)";
      document.getElementById('guideGlow').innerText = "Kéo màu chi tiết về TRẮNG HOÀN TOÀN (#FFFFFF) rồi bấm nút dưới.";
      setStatus("Sẵn sàng hoạt động");
    }
  </script>
</body>
</html>
